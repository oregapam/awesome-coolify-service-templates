# documentation: https://github.com/ferdium/ferdium-server
# slogan: The server component that can either be self-hosted or hosted for general purpose - for use with the ferdium thick client.
# tags: productivity,communication,collaboration,open-source
# port: 3333
# author: @oregapam
# repository: https://github.com/oregapam/awesome-coolify-service-templates

services:
  ferdium-server:
    image: ferdium/ferdium-server:latest
    container_name: ferdium-server
    environment:
      # URL settings
      - SERVICE_FQDN_FERDIUM_3333
      - APP_URL=${SERVICE_URL_FERDIUM}
      # Environment settings (can be development, production)
      - NODE_ENV=production
      # Database settings
      # Database type (can be MariaDB/MySQL (mysql), PostgreSQL (pg), SQLite (sqlite))
      - DB_CONNECTION=${DB_CONNECTION:-sqlite}
      # Database credentials
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${SERVICE_USER_DB:-root}
      - DB_PASSWORD=${SERVICE_PASSWORD_DB}
      - DB_DATABASE=${DB_DATABASE:-ferdium}
      - DB_SSL=${DB_SSL:-false}
      # SMTP Mail settings
      - MAIL_CONNECTION=smtp
      - SMTP_HOST=${SMTP_HOST:?}
      - SMTP_PORT=${SMTP_PORT:?}
      - MAIL_SSL=${MAIL_SSL:-false}
      - MAIL_USERNAME=${MAIL_USERNAME:?}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?}
      - MAIL_SENDER=${MAIL_SENDER:?}
      # SparkPost settings
      #- SPARKPOST_API_KEY=${SPARKPOST_API_KEY}
      # Mailgun settings
      #- MAILGUN_DOMAIN=${MAILGUN_DOMAIN:?}
      #- MAILGUN_API_REGION=${MAILGUN_API_REGION:?}
      #- MAILGUN_API_KEY=${MAILGUN_API_KEY:?}
      # First seed settings (only used on first run)
      - IS_CREATION_ENABLED=${IS_CREATION_ENABLED:-true}
      - IS_LOGIN_ENABLED=${IS_LOGIN_ENABLED:-true}
      - IS_DASHBOARD_ENABLED=${IS_DASHBOARD_ENABLED:-true}
      - IS_REGISTRATION_ENABLED=${IS_REGISTRATION_ENABLED:-true}
      - CONNECT_WITH_FRANZ=${CONNECT_WITH_FRANZ:-true}
      - DATA_DIR=${DATA_DIR:-/data}
      - JWT_USE_PEM=${JWT_USE_PEM:-true}
    volumes:
      - ferdium-database-vol:/data
      - ferdium-recipes-vol:/app/build/recipes
    restart: unless-stopped
volumes:
  ferdium-recipes-vol:
  ferdium-database-vol: